name: Daily Contributions

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Runs 4 times a day, every 6 hours
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update contribution tracker
        run: |
          echo "Last run: $(date)" > .github/contribution_tracker.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add .github/contribution_tracker.txt
          git commit -m "Automated commit to track daily contributions"
          git push
