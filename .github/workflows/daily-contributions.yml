name: Daily Contributions

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs once a day at midnight UTC
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate 3-5 commits and push
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          # Generate random number between 3 and 5
          NUM_COMMITS=$(( ( RANDOM % 3 ) + 3 ))
          echo "Generating $NUM_COMMITS commits..."

          for i in $(seq 1 $NUM_COMMITS); do
            echo "Commit $i on $(date)" > .github/contribution_tracker.txt
            git add .github/contribution_tracker.txt
            git commit -m "Automated contribution commit $i/$(date +'%Y-%m-%d')"
            # sleep briefly to ensure distinct timestamps just in case
            sleep 1
          done

          git push
