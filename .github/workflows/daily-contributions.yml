name: Daily Contributions

on:
  push:
    branches:
      - main
  schedule:
    # Runs once a day at midnight UTC to fulfill the 3-5 daily commits requirement
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate 3-5 commits and push to fill contributions
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: ./generate_commits.sh
